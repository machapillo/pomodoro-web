<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pomodoro Timer – 作業に集中できるシンプルなタイマー</title>
  <meta name="description" content="作業・短い休憩・長い休憩を自動でサイクルするシンプルなポモドーロタイマー。ブラウザだけで使えて、設定のカスタマイズや進捗表示に対応。" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://machapillo.github.io/pomodoro-web/" />

  <!-- Open Graph (OGP) -->
  <meta property="og:title" content="Pomodoro Timer – 作業に集中できるシンプルなタイマー" />
  <meta property="og:description" content="ブラウザだけで使えるポモドーロタイマー。作業・短休・長休の自動サイクル、進捗バー、カスタマイズ対応。" />
  <meta property="og:url" content="https://machapillo.github.io/pomodoro-web/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://machapillo.github.io/pomodoro-web/og-image.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pomodoro Timer – 作業に集中できるシンプルなタイマー" />
  <meta name="twitter:description" content="ブラウザだけで使えるポモドーロタイマー。設定カスタマイズと進捗表示に対応。" />
  <meta name="twitter:image" content="https://machapillo.github.io/pomodoro-web/og-image.png" />

  <!-- Robots -->
  <meta name="robots" content="index,follow" />

  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#e74c3c" />

  <!-- Icons and manifest (optional) -->
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>🍅 Pomodoro Timer</h1>
    <p class="subtitle">作業・短い休憩・長い休憩を自動でサイクル</p>
  </header>

  <main class="container">
    <section class="status">
      <div class="status-title">
        <span id="state-emoji">🍅</span>
        <span id="state-label">作業中</span>
        <span id="cycle-label" class="muted"></span>
      </div>
      <div id="time-remaining" class="big"></div>
      <div class="progress">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="percentage" class="muted"></div>
    </section>

    <section class="settings">
      <h2>現在の設定</h2>
      <div class="grid">
        <label>作業 (分)
          <input id="work" type="number" min="1" value="25"/>
        </label>
        <label>短い休憩 (分)
          <input id="shortBreak" type="number" min="1" value="5"/>
        </label>
        <label>長い休憩 (分)
          <input id="longBreak" type="number" min="1" value="15"/>
        </label>
        <label>長休憩までの回数
          <input id="cycles" type="number" min="1" value="4"/>
        </label>
      </div>
      <div class="controls">
        <button id="startBtn" class="primary">開始</button>
        <button id="pauseBtn">一時停止</button>
        <button id="resetBtn">リセット</button>
      </div>
      <div class="note muted">bell.mp3 をこのフォルダに置くと、各セッション終了時に音が鳴ります（無くてもOK）。</div>
    </section>
  </main>

  <footer class="footer muted">
    <span>Ctrl/Cmd+W で閉じるとタイマーは止まります。ブラウザのタブをアクティブにしてご利用ください。</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
